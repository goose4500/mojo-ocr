# Tooling configuration only; this repository is not yet a pip package.
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["output", "inputs", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests support unittest discovery without installing the flat source tree.
"tests/*.py" = ["E402"]
