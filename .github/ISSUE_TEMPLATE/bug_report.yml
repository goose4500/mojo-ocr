name: Bug report
description: Report a reproducible problem using a synthetic or public example.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not attach private documents, credentials, or personal OCR exports. Security issues belong in private vulnerability reporting, not this form."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands or UI steps; attach only synthetic/public input you can redistribute.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, CPU architecture, Python version, mojo --version, commit, and model hash if relevant.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that this report contains no private documents, secrets, or personal data.
          required: true
